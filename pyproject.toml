[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paisa-footprint"
version = "0.1.0"
description = "Financed emissions (PCAF) for Indian equity portfolios, computed from companies' own BRSR filings."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "lxml>=5",
  "pydantic>=2",
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  "pandas-stubs",
  "lxml-stubs",
]

[project.scripts]
pf = "cli.pf:app"

[tool.setuptools.packages.find]
include = ["pf_core*", "cli*", "api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"cli/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pf_core.*"
strict = true
