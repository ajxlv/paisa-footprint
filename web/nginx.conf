server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes (/companies/..., /portfolio) all serve the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
